name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install --upgrade pip pytest

      - name: Run pytest
        run: python3 -m pytest tests/ -v -rs

      - name: Bash syntax check (orchestration scripts)
        run: |
          bash -n setup_dave.sh
          bash -n build_training_data.sh
          bash -n RUN_DAVE.sh
          bash -n scripts/publish_adapter.sh
